#灯条检测相关
lightbar:
  color: blue        # blue / red / purple
  h_min: 90
  h_max: 130
  s_min: 40
  s_max: 255
  v_min: 200
  v_max: 255

detect:
  min_area: 20
  max_area: 1000
  min_ratio: 3.0 
  max_ratio: 6
  max_angle_error: 20.0 # 灯条与水平线的最大夹角（度）
  max_group_distance: 50
  min_row_lightbars: 2
  max_row_lightbars: 3
  min_top_bottom_distance: 20
  max_top_bottom_distance: 100
# 相机内参
camera_intrinsics:
  fx: 800.0          # 焦距 x (像素)
  fy: 800.0          # 焦距 y (像素)
  cx: 640.0          # 光心 x (像素)
  cy: 360.0          # 光心 y (像素)
  image_width: 1280
  image_height: 720

# 云台-相机外参 (相机相对于云台的安装位置)
gimbal_camera_extrinsics:
  translation:       # 平移向量 (米)
    x: 0.05          # 相机相对于云台旋转中心的 X 偏移
    y: 0.02          # 相机相对于云台旋转中心的 Y 偏移  
    z: 0.03          # 相机相对于云台旋转中心的 Z 偏移
  rotation:          # 旋转角度 (度) - 相机安装角度偏差
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

# 测距参数
depth_estimation:
  default_distance: 10.0   # 默认距离（米），可根据需要调整
  use_depth_sensor: false  # 是否使用深度传感器
  
# 串口配置（波特率固定921600，仅需修改串口名）
serial:
  port: "/dev/ttyUSB0"       # 串口设备名
  timeout: 1000              # 超时时间（ms）

# 运动学参数
kinematics:
  delta: 1.5708              # M_PI_2
  yita1: -1.5708             # -M_PI_2
  yita2: 0.5236              # 30°转弧度
  yita3: 2.6180              # 150°转弧度
  arfa1: 0.9425              # 54°转弧度
  arfa2: 1.5708              # M_PI_2