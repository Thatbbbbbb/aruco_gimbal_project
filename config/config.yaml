#灯条检测相关
lightbar:
  color: red        # blue / red / purple
  h_min: 90
  h_max: 130
  s_min: 40
  s_max: 255
  v_min: 200
  v_max: 255

detect:
  min_area: 20
  max_area: 1000
  min_ratio: 3.0 
  max_ratio: 6
  max_angle_error: 20.0 # 灯条与水平线的最大夹角（度）
  max_group_distance: 50
  min_row_lightbars: 2
  max_row_lightbars: 3
  min_top_bottom_distance: 20
  max_top_bottom_distance: 100
# 相机内外参
camera_matrix: [1.789950341146367e+03, 0,6.244899091043944e+02,0, 1.789941268241911e+03, 5.165767655720214e+02,0, 0, 1]
distort_coeffs: [-0.086007586707543,0.037629005591832,6.416956508541191e-04,-3.846772859023321e-04,0.460510666430202]

R_camera2gimbal: [-1, 0, 0, 0, 0, -1, 0, -1, 0]
t_camera2gimbal: [35e-3, -35e-3, 27e-3] # 单位 m（暂定）

origin2laser: 42.7e-3 # 单位 m，激光器相对球心的距离
# 测距参数
depth_estimation:
  default_distance: 10.0   # 默认距离（米），可根据需要调整
  use_depth_sensor: false  # 是否使用深度传感器
  
# 串口配置（波特率固定921600，仅需修改串口名）
serial:
  port: "/dev/ttyUSB0"       # 串口设备名
  timeout: 1000              # 超时时间（ms）

# 运动学参数
kinematics:
  delta: 1.5708              # M_PI_2
  yita1: -1.5708             # -M_PI_2
  yita2: 0.5236              # 30°转弧度
  yita3: 2.6180              # 150°转弧度
  arfa1: 0.9425              # 54°转弧度
  arfa2: 1.5708              # M_PI_2